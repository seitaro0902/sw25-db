<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SW2.5 データライブラリ</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e293b">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 pb-12">

  <header class="bg-slate-800 text-white p-4 sticky top-0 z-10 shadow-md">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold flex items-center gap-2">
        <span>🎲</span> SW2.5 データベース
      </h1>
      <div class="flex bg-slate-700 p-1 rounded-lg text-sm">
        <button id="tab-all" onclick="setTab('all')" class="px-3 py-1 rounded-md bg-slate-900 font-bold transition">すべて</button>
        <button id="tab-fav" onclick="setTab('fav')" class="px-3 py-1 rounded-md text-slate-300 transition">★ お気に入り</button>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-4 space-y-4">
    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
      <input type="text" id="search-input" oninput="handleSearch()" placeholder="名称、効果、概要、属性などで検索..." 
             class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-500">

      <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-sm">
        <select id="main-category" onchange="onMainCategoryChange(); handleSearch();" class="px-3 py-2 border border-slate-300 rounded-lg bg-white">
          <option value="all">すべての大カテゴリ</option>
          <option value="魔法">魔法</option>
          <option value="練技">練技</option>
          <option value="呪歌・終律">呪歌・終律</option>
          <option value="騎芸">騎芸</option>
          <option value="賦術">賦術</option>
          <option value="戦闘特技">戦闘特技</option>
          <option value="武器">武器</option>
          <option value="防具">防具</option>
          <option value="アイテム">アイテム</option>
          <option value="装飾品">装飾品</option>
          <option value="騎獣">騎獣</option>
        </select>

        <select id="sub-category" onchange="onSubCategoryChange(); handleSearch();" class="px-3 py-2 border border-slate-300 rounded-lg bg-white">
          <option value="all">すべての中カテゴリ</option>
        </select>

        <select id="level-filter" onchange="handleSearch()" class="hidden px-3 py-2 border border-slate-300 rounded-lg bg-white">
          <option value="all">すべてのレベル</option>
        </select>

        <select id="rank-filter" onchange="handleSearch()" class="hidden px-3 py-2 border border-slate-300 rounded-lg bg-white">
          <option value="all">すべてのランク</option>
          <option value="B">Bランク</option>
          <option value="A">Aランク</option>
          <option value="S">Sランク</option>
          <option value="SS">SSランク</option>
        </select>

        <select id="special-filter" onchange="handleSearch()" class="hidden px-3 py-2 border border-slate-300 rounded-lg bg-white col-span-2 sm:col-span-1">
          <option value="all">すべての分類</option>
        </select>

        <select id="sort-select" onchange="handleSearch()" class="px-3 py-2 border border-slate-300 rounded-lg bg-white">
          <option value="categoryOrder">大カテゴリ順</option>
          <option value="name">五十音順</option>
          <option value="level">レベル昇順</option>
          <option value="rank">ランク順 (B→SS)</option>
          <option value="reqStr">必筋が低い順</option>
          <option value="power">威力が高い順</option>
          <option value="price">価格が安い順</option>
        </select>
      </div>
    </div>

    <div class="text-xs text-slate-500 px-1" id="result-count">検索結果: 0件</div>
    <div id="card-container" class="grid gap-3 sm:grid-cols-2"></div>
  </main>

  <script>
    const mainCategoryOrder = [
      "魔法", "練技", "呪歌・終律", "騎芸", "賦術", "戦闘特技", 
      "武器", "防具", "アイテム", "装飾品", "騎獣"
    ];

    const typeEnglishToJapanese = {
      "weapon": "武器", "magic": "魔法", "armor": "防具", "item": "アイテム", "accessory": "装飾品"
    };

    const subCategoryMap = {
      "魔法": ["真語魔法", "操霊魔法", "神聖魔法", "魔動機術", "妖精魔法"],
      "練技": [],
      "呪歌・終律": ["呪歌", "終律"],
      "騎芸": [],
      "賦術": [],
      "戦闘特技": ["選択・常時", "選択・宣言", "選択・主動作", "自動・常時"],
      "武器": ["ソード", "アックス", "スピア", "メイス", "スタッフ", "フレイル", "ウォーハンマー", "格闘", "投擲", "ボウ", "クロスボウ", "ガン", "矢弾"],
      "防具": ["非金属鎧", "金属鎧", "盾"],
      "アイテム": ["冒険者技能用アイテム", "冒険者道具類"],
      "装飾品": ["頭", "顔", "耳", "首", "背中", "手", "腰", "足", "任意"],
      "騎獣": []
    };

    const specialCategoryMap = {
      "神聖魔法": [
        "基本神聖魔法", "始祖神ライフォス", "太陽神ティダン", "賢神キルヒア", "妖精神アステリア", 
        "炎武帝グレンダール", "月神シーン", "神の指先ミルタバル", "奈落の盾神イーヴ", 
        "導きの星神ハルーラ", "樹神ダリオン", "慈愛と復讐の女神ミリッツァ", "風と雨の女神フルシル", "鉄道神王ストラスフォード"
      ],
      "妖精魔法": ["基本妖精魔法", "土", "水・氷", "炎", "風", "光", "闇"]
    };

    let items = [];
    let bookmarks = JSON.parse(localStorage.getItem('sw25_bookmarks') || '[]');
    let activeTab = 'all';

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }

    async function loadData() {
      try {
        const response = await fetch('data.json');
        const rawData = await response.json();
        
        items = rawData.map(item => {
          // 英語表記の変換
          if (typeEnglishToJapanese[item.type]) {
            item.type = typeEnglishToJapanese[item.type];
          }

          // 中カテゴリが type に入っている場合、大カテゴリ("魔法"等)と中カテゴリ("真語魔法"等)に自動分離
          for (const [mainCat, subCats] of Object.entries(subCategoryMap)) {
            if (subCats.includes(item.type)) {
              item.category = item.type;
              item.type = mainCat;
              break;
            }
          }

          // overview（概要）を summary に補正
          if (item.overview && !item.summary) {
            item.summary = item.overview;
          }

          return item;
        });

        onMainCategoryChange();
        handleSearch();
      } catch (e) {
        document.getElementById('card-container').innerHTML = 
          `<div class="col-span-full text-center py-8 text-rose-500">データの読み込みに失敗しました。</div>`;
      }
    }

    function renderTimingIcons(timing) {
      if (!timing) return '';
      const list = Array.isArray(timing) ? timing : [timing];
      let html = '<span class="inline-flex gap-0.5 items-center mr-1.5 leading-none">';

      list.forEach(t => {
        if (t === '補助動作' || t === '▶▶') {
          html += `<span class="bg-slate-900 text-white px-1 py-0.5 rounded text-[11px] font-bold tracking-tighter" title="補助動作">▶▶</span>`;
        } else if (t === '戦闘準備' || t === '△') {
          html += `<span class="bg-slate-100 text-slate-800 border border-slate-400 px-1 py-0.5 rounded text-[11px] font-bold" title="戦闘準備">△</span>`;
        } else if (t === '主動作' || t === '▶') {
          html += `<span class="bg-slate-900 text-white px-1 py-0.5 rounded text-[11px] font-bold" title="主動作">▶</span>`;
        } else {
          html += `<span class="bg-slate-200 text-slate-700 px-1 py-0.5 rounded text-[10px] font-bold">${t}</span>`;
        }
      });

      html += '</span>';
      return html;
    }
    
    function renderGakusoIcon(val) {
      if (!val || val === '-') return '-';
      let text = String(val);
      text = text.replace(/\[高揚\]/g, 
        `<span class="inline-flex items-center justify-center px-1.5 py-0.5 rounded-full bg-emerald-100 text-emerald-700 border border-emerald-300 font-extrabold text-xs mr-0.5" title="高揚">⤴︎</span>`
      );
      text = text.replace(/\[鎮静\]/g, 
        `<span class="inline-flex items-center justify-center px-1.5 py-0.5 rounded-full bg-sky-100 text-sky-700 border border-sky-300 font-extrabold text-xs mr-0.5" title="鎮静">⤵︎</span>`
      );
      text = text.replace(/\[魅惑\]/g, 
        `<span class="inline-flex items-center justify-center px-1.5 py-0.5 rounded-full bg-pink-100 text-pink-600 border border-pink-300 text-xs mr-0.5" title="魅惑">♥</span>`
      );
      return text;
    }
    
    // 各カテゴリごとのステータス表レンダラー
    function renderSpecTable(item) {
      const type = item.type;
      const category = item.category;

      const cell = (label, val) => `<div><span class="text-slate-400 block text-[9px] leading-tight">${label}</span><span class="font-medium text-slate-800">${val ?? '-'}</span></div>`;

      // 1. 魔法（真語・操霊・神聖・妖精）
      if (type === '魔法' && category !== '魔動機術') {
        return `<div class="grid grid-cols-3 sm:grid-cols-6 gap-1 bg-slate-50 p-2 rounded text-center text-xs mb-2 border border-slate-100">
          ${cell('消費', item.mp)}
          ${cell('対象', item.target)}
          ${cell('射程/形状', item.range)}
          ${cell('時間', item.duration)}
          ${cell('抵抗', item.resist)}
          ${cell('属性', item.element)}
        </div>`;
      }

      // 2. 魔動機術
      if (type === '魔法' && category === '魔動機術') {
        return `<div class="grid grid-cols-3 sm:grid-cols-7 gap-1 bg-slate-50 p-2 rounded text-center text-xs mb-2 border border-slate-100">
          ${cell('スフィア', item.magisphere)}
          ${cell('消費', item.mp)}
          ${cell('対象', item.target)}
          ${cell('射程/形状', item.range)}
          ${cell('時間', item.duration)}
          ${cell('抵抗', item.resist)}
          ${cell('属性', item.element)}
        </div>`;
      }

      // 3. 練技
      if (type === '練技') {
        return `<div class="grid grid-cols-1 gap-1 bg-slate-50 p-2 rounded text-center text-xs mb-2 border border-slate-100">
          ${cell('時間', item.duration)}
        </div>`;
      }

      // 4. 呪歌
      if (type === '呪歌・終律' && category === '呪歌') {
        return `<div class="grid grid-cols-3 sm:grid-cols-5 gap-1 bg-slate-50 p-2 rounded text-center text-xs mb-2 border border-slate-100">
          ${cell('歌唱', item.singing)}
          ${cell('ペット', item.pet)}
          ${cell('発生条件', item.condition)}
          ${cell('抵抗', item.resist)}
          ${cell('属性', item.element)}
          ${cell('基礎楽素', renderGakusoIcon(item.baseElement))}
          ${cell('巧奏値', item.craftVal)}
          ${cell('追加楽素', renderGakusoIcon(item.addElement))}
        </div>`;
      }

      // 5. 終律
      if (type === '呪歌・終律' && category === '終律') {
        return `<div class="grid grid-cols-3 gap-1 bg-slate-50 p-2 rounded text-center text-xs mb-2 border border-slate-100">
          ${cell('消費', renderGakusoIcon(item.mp))}
          ${cell('抵抗', item.resist)}
          ${cell('属性', item.element)}
        </div>`;
      }

      // 6. 騎芸
      if (type === '騎芸') {
        return `<div class="grid grid-cols-3 gap-1 bg-slate-50 p-2 rounded text-center text-xs mb-2 border border-slate-100">
          ${cell('前提', item.prereq)}
          ${cell('対応', item.compatible)}
          ${cell('適用部位', item.part)}
        </div>`;
      }

      // 7. 賦術
      if (type === '賦術') {
        return `<div class="grid grid-cols-3 sm:grid-cols-5 gap-1 bg-slate-50 p-2 rounded text-center text-xs mb-2 border border-slate-100">
          ${cell('消費', item.mp)}
          ${cell('対象', item.target)}
          ${cell('射程/形状', item.range)}
          ${cell('時間', item.duration)}
          ${cell('抵抗', item.resist)}
        </div>`;
      }

      // 8. 戦闘特技
      if (type === '戦闘特技') {
        return `<div class="grid grid-cols-2 gap-1 bg-slate-50 p-2 rounded text-center text-xs mb-2 border border-slate-100">
          ${cell('前提', item.prereq)}
          ${cell('使用', item.usage)}
        </div>`;
      }

      // 9. 武器
      if (type === '武器') {
        if (category === '投擲') {
          return `<div class="grid grid-cols-4 sm:grid-cols-7 gap-1 bg-slate-50 p-2 rounded text-center text-xs mb-2 border border-slate-100">
            ${cell('用法', item.usage)}
            ${cell('必筋', item.reqStr)}
            ${cell('命中', item.acc)}
            ${cell('威力', item.power)}
            ${cell('C値', item.crit)}
            ${cell('追加D', item.extraDmg)}
            ${cell('射程', item.range)}
          </div>`;
        } else if (category === 'ガン') {
          return `<div class="grid grid-cols-3 sm:grid-cols-6 gap-1 bg-slate-50 p-2 rounded text-center text-xs mb-2 border border-slate-100">
            ${cell('用法', item.usage)}
            ${cell('装填数', item.maxAmmo)}
            ${cell('命中', item.acc)}
            ${cell('C値', item.crit)}
            ${cell('追加D', item.extraDmg)}
            ${cell('射程', item.range)}
          </div>`;
        } else if (category === '矢弾') {
          return `<div class="grid grid-cols-1 gap-1 bg-slate-50 p-2 rounded text-center text-xs mb-2 border border-slate-100">
            ${cell('対応カテゴリ', item.compatibleCategory)}
          </div>`;
        } else {
          return `<div class="grid grid-cols-3 sm:grid-cols-6 gap-1 bg-slate-50 p-2 rounded text-center text-xs mb-2 border border-slate-100">
            ${cell('用法', item.usage)}
            ${cell('必筋', item.reqStr)}
            ${cell('命中', item.acc)}
            ${cell('威力', item.power)}
            ${cell('C値', item.crit)}
            ${cell('追加D', item.extraDmg)}
          </div>`;
        }
      }

      // 10. 防具
      if (type === '防具') {
        if (category === '盾') {
          return `<div class="grid grid-cols-4 gap-1 bg-slate-50 p-2 rounded text-center text-xs mb-2 border border-slate-100">
            ${cell('用法', item.usage)}
            ${cell('必筋', item.reqStr)}
            ${cell('回避', item.evasion)}
            ${cell('防護点', item.def)}
          </div>`;
        } else {
          return `<div class="grid grid-cols-3 gap-1 bg-slate-50 p-2 rounded text-center text-xs mb-2 border border-slate-100">
            ${cell('必筋', item.reqStr)}
            ${cell('回避', item.evasion)}
            ${cell('防護点', item.def)}
          </div>`;
        }
      }

      return '';
    }

    function onMainCategoryChange() {
      const mainCat = document.getElementById('main-category').value;
      const subSelect = document.getElementById('sub-category');
      const levelSelect = document.getElementById('level-filter');
      const rankSelect = document.getElementById('rank-filter');

      subSelect.innerHTML = '<option value="all">すべての中カテゴリ</option>';
      if (mainCat !== 'all' && subCategoryMap[mainCat]) {
        subCategoryMap[mainCat].forEach(sub => {
          const opt = document.createElement('option');
          opt.value = sub;
          opt.textContent = sub;
          subSelect.appendChild(opt);
        });
      }

      const levelCategories = ["魔法", "練技", "呪歌・終律", "騎芸", "賦術"];
      const rankCategories = ["武器", "防具"];

      if (levelCategories.includes(mainCat)) {
        levelSelect.classList.remove('hidden');
        rankSelect.classList.add('hidden');
        rankSelect.value = 'all';

        levelSelect.innerHTML = '<option value="all">すべてのレベル</option>';
        if (mainCat === "魔法") {
          for (let i = 1; i <= 15; i++) {
            const opt = document.createElement('option');
            opt.value = i;
            opt.textContent = `${i}レベル`;
            levelSelect.appendChild(opt);
          }
        } else {
          [1, 5, 10].forEach(lvl => {
            const opt = document.createElement('option');
            opt.value = lvl;
            opt.textContent = `${lvl}レベル`;
            levelSelect.appendChild(opt);
          });
        }
      } else if (rankCategories.includes(mainCat)) {
        rankSelect.classList.remove('hidden');
        levelSelect.classList.add('hidden');
        levelSelect.value = 'all';
      } else {
        levelSelect.classList.add('hidden');
        rankSelect.classList.add('hidden');
        levelSelect.value = 'all';
        rankSelect.value = 'all';
      }

      onSubCategoryChange();
    }

    function onSubCategoryChange() {
      const subCat = document.getElementById('sub-category').value;
      const specialSelect = document.getElementById('special-filter');

      if (specialCategoryMap[subCat]) {
        specialSelect.classList.remove('hidden');
        specialSelect.innerHTML = '<option value="all">すべての特殊分類</option>';
        specialCategoryMap[subCat].forEach(sp => {
          const opt = document.createElement('option');
          opt.value = sp;
          opt.textContent = sp;
          specialSelect.appendChild(opt);
        });
      } else {
        specialSelect.classList.add('hidden');
        specialSelect.value = 'all';
      }
    }

    function setTab(tab) {
      activeTab = tab;
      document.getElementById('tab-all').className = tab === 'all' ? 'px-3 py-1 rounded-md bg-slate-900 font-bold transition' : 'px-3 py-1 rounded-md text-slate-300 transition';
      document.getElementById('tab-fav').className = tab === 'fav' ? 'px-3 py-1 rounded-md bg-slate-900 font-bold transition' : 'px-3 py-1 rounded-md text-slate-300 transition';
      handleSearch();
    }

    function toggleBookmark(id) {
      if (bookmarks.includes(id)) {
        bookmarks = bookmarks.filter(bId => bId !== id);
      } else {
        bookmarks.push(id);
      }
      localStorage.setItem('sw25_bookmarks', JSON.stringify(bookmarks));
      handleSearch();
    }

    function handleSearch() {
      const keyword = document.getElementById('search-input').value.toLowerCase();
      const mainCat = document.getElementById('main-category').value;
      const subCat = document.getElementById('sub-category').value;
      const selectedLevel = document.getElementById('level-filter').value;
      const selectedRank = document.getElementById('rank-filter').value;
      const selectedSpecial = document.getElementById('special-filter').value;
      const sortKey = document.getElementById('sort-select').value;

      let filtered = items.filter(item => {
        if (activeTab === 'fav' && !bookmarks.includes(item.id)) return false;
        if (mainCat !== 'all' && item.type !== mainCat) return false;
        if (subCat !== 'all' && item.category !== subCat) return false;
        if (selectedLevel !== 'all' && String(item.level) !== String(selectedLevel)) return false;
        if (selectedRank !== 'all' && item.rank !== selectedRank) return false;
        if (selectedSpecial !== 'all' && item.special !== selectedSpecial) return false;

        const matchText = (
          (item.name || '') + 
          (item.category || '') + 
          (item.special || '') + 
          (item.summary || '') + 
          (item.effect || '') + 
          (item.element || '') + 
          (item.remarks || '')
        ).toLowerCase();
        return matchText.includes(keyword);
      });

      const rankOrder = { "B": 1, "A": 2, "S": 3, "SS": 4 };
      filtered.sort((a, b) => {
        if (sortKey === 'categoryOrder') {
          const indexA = mainCategoryOrder.indexOf(a.type);
          const indexB = mainCategoryOrder.indexOf(b.type);
          return (indexA === -1 ? 999 : indexA) - (indexB === -1 ? 999 : indexB);
        }
        if (sortKey === 'name') return a.name.localeCompare(b.name, 'ja');
        if (sortKey === 'level') return (a.level || 0) - (b.level || 0);
        if (sortKey === 'rank') return (rankOrder[a.rank] || 0) - (rankOrder[b.rank] || 0);
        if (sortKey === 'reqStr') return (a.reqStr || 0) - (b.reqStr || 0);
        if (sortKey === 'power') return (b.power || 0) - (a.power || 0);
        if (sortKey === 'price') return (a.price || 0) - (b.price || 0);
        return 0;
      });

      render(filtered);
    }

    function render(data) {
      const container = document.getElementById('card-container');
      document.getElementById('result-count').textContent = `検索結果: ${data.length}件`;
      container.innerHTML = '';

      if (data.length === 0) {
        container.innerHTML = `<div class="col-span-full text-center py-8 text-slate-400">該当するデータが見つかりません。</div>`;
        return;
      }

      data.forEach(item => {
        const isFav = bookmarks.includes(item.id);
        const card = document.createElement('div');
        card.className = "bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col justify-between hover:border-slate-400 transition";

        card.innerHTML = `
          <div>
            <div class="flex justify-between items-start mb-2">
              <div>
                <div class="flex flex-wrap gap-1 mb-1">
                  <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-slate-800 text-white">${item.type}</span>
                  ${item.category ? `<span class="text-[10px] font-bold px-2 py-0.5 rounded bg-slate-100 text-slate-600 border">${item.category}</span>` : ''}
                  ${item.level ? `<span class="text-[10px] font-bold px-2 py-0.5 rounded bg-blue-100 text-blue-800 border border-blue-200">Lv.${item.level}</span>` : ''}
                  ${item.rank ? `<span class="text-[10px] font-bold px-2 py-0.5 rounded bg-amber-100 text-amber-800 border border-amber-300">${item.rank}ランク</span>` : ''}
                  ${item.special ? `<span class="text-[10px] font-bold px-2 py-0.5 rounded bg-emerald-100 text-emerald-800 border border-emerald-200">${item.special}</span>` : ''}
                </div>
                <h2 class="text-base font-bold text-slate-900 flex items-center">
                  ${renderTimingIcons(item.timing)}
                  <span>【${item.name}】</span>
                </h2>
              </div>
              <button onclick="toggleBookmark('${item.id}')" class="text-xl leading-none p-1 focus:outline-none">
                ${isFav ? '★' : '☆'}
              </button>
            </div>

            ${item.summary ? `<p class="text-xs font-semibold text-slate-700 mb-2 bg-slate-50 p-1.5 rounded border-l-2 border-slate-400">${item.summary}</p>` : ''}

            ${renderSpecTable(item)}

            <p class="text-xs text-slate-600 mb-3 leading-relaxed whitespace-pre-wrap">${item.effect || item.details || ''}</p>
            ${item.remarks ? `<p class="text-[11px] text-slate-500 italic mb-2">備考: ${item.remarks}</p>` : ''}
          </div>

          <div class="flex justify-between items-center text-[11px] text-slate-400 pt-2 border-t border-slate-100">
            ${item.price && item.price !== '-' ? `<span>価格: <strong class="text-slate-700">${item.price} G</strong></span>` : '<div></div>'}
            <span>${item.book || ''} ${item.page ? 'p.' + item.page : ''}</span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    loadData();
  </script>
</body>
</html>
