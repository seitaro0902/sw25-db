<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SW2.5 データライブラリ</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e293b">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 pb-12">

  <header class="bg-slate-800 text-white p-4 sticky top-0 z-10 shadow-md">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold flex items-center gap-2">
        <span>🎲</span> SW2.5 データベース
      </h1>
      <div class="flex bg-slate-700 p-1 rounded-lg text-sm">
        <button id="tab-all" onclick="setTab('all')" class="px-3 py-1 rounded-md bg-slate-900 font-bold transition">すべて</button>
        <button id="tab-fav" onclick="setTab('fav')" class="px-3 py-1 rounded-md text-slate-300 transition">★ お気に入り</button>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-4 space-y-4">
    <!-- 検索・フィルターエリア -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
      <input type="text" id="search-input" oninput="handleSearch()" placeholder="名称、効果などで検索..." 
             class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-500">

      <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-sm">
        <!-- 大カテゴリ -->
        <select id="main-category" onchange="updateSubCategories(); handleSearch();" class="px-3 py-2 border border-slate-300 rounded-lg bg-white">
          <option value="all">すべての大カテゴリ</option>
          <option value="魔法">魔法</option>
          <option value="練技">練技</option>
          <option value="呪歌・終律">呪歌・終律</option>
          <option value="騎芸">騎芸</option>
          <option value="賦術">賦術</option>
          <option value="戦闘特技">戦闘特技</option>
          <option value="武器">武器</option>
          <option value="防具">防具</option>
          <option value="アイテム">アイテム</option>
          <option value="装飾品">装飾品</option>
          <option value="騎獣">騎獣</option>
        </select>

        <!-- 中カテゴリ -->
        <select id="sub-category" onchange="handleSearch()" class="px-3 py-2 border border-slate-300 rounded-lg bg-white">
          <option value="all">すべての中カテゴリ</option>
        </select>

        <!-- ランク -->
        <select id="rank-filter" onchange="handleSearch()" class="px-3 py-2 border border-slate-300 rounded-lg bg-white">
          <option value="all">すべてのランク</option>
          <option value="B">Bランク</option>
          <option value="A">Aランク</option>
          <option value="S">Sランク</option>
          <option value="SS">SSランク</option>
        </select>

        <!-- ソート -->
        <select id="sort-select" onchange="handleSearch()" class="px-3 py-2 border border-slate-300 rounded-lg bg-white">
          <option value="categoryOrder">大カテゴリ順</option>
          <option value="name">五十音順</option>
          <option value="reqStr">必筋が低い順</option>
          <option value="power">威力が高い順</option>
          <option value="price">価格が安い順</option>
        </select>
      </div>
    </div>

    <div class="text-xs text-slate-500 px-1" id="result-count">検索結果: 0件</div>
    <div id="card-container" class="grid gap-3 sm:grid-cols-2"></div>
  </main>

  <script>
    // 指定された大カテゴリの優先順位
    const mainCategoryOrder = [
      "魔法", "練技", "呪歌・終律", "騎芸", "賦術", "戦闘特技", 
      "武器", "防具", "アイテム", "装飾品", "騎獣"
    ];

    // 英語表記から日本語への変換マップ
    const typeEnglishToJapanese = {
      "weapon": "武器",
      "magic": "魔法",
      "armor": "防具",
      "item": "アイテム",
      "accessory": "装飾品"
    };

    // 中カテゴリマップ
    const subCategoryMap = {
      "魔法": ["真語魔法", "操霊魔法", "神聖魔法", "魔動機術", "妖精魔法"],
      "練技": ["1レベル", "5レベル", "10レベル"],
      "呪歌・終律": ["呪歌", "終律"],
      "騎芸": ["1レベル", "5レベル", "10レベル"],
      "賦術": ["1レベル", "5レベル", "10レベル"],
      "戦闘特技": ["選択・常時", "選択・宣言", "選択・主動作", "自動・常時"],
      "武器": ["ソード", "アックス", "スピア", "メイス", "スタッフ", "フレイル", "ウォーハンマー", "格闘", "投擲", "ボウ", "クロスボウ", "ガン", "矢弾"],
      "防具": ["非金属鎧", "金属鎧", "盾"],
      "アイテム": ["冒険者技能用アイテム", "冒険者道具類"],
      "装飾品": ["頭", "顔", "耳", "首", "背中", "手", "腰", "足", "任意"],
      "騎獣": []
    };

    let items = [];
    let bookmarks = JSON.parse(localStorage.getItem('sw25_bookmarks') || '[]');
    let activeTab = 'all';

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }

    async function loadData() {
      try {
        const response = await fetch('data.json');
        const rawData = await response.json();
        
        // データの表記揺れ（英語→日本語）を自動補正
        items = rawData.map(item => {
          if (typeEnglishToJapanese[item.type]) {
            item.type = typeEnglishToJapanese[item.type];
          }
          return item;
        });

        updateSubCategories();
        handleSearch();
      } catch (e) {
        document.getElementById('card-container').innerHTML = 
          `<div class="col-span-full text-center py-8 text-rose-500">データの読み込みに失敗しました。</div>`;
      }
    }

    function updateSubCategories() {
      const mainCat = document.getElementById('main-category').value;
      const subSelect = document.getElementById('sub-category');
      subSelect.innerHTML = '<option value="all">すべての中カテゴリ</option>';

      if (mainCat !== 'all' && subCategoryMap[mainCat]) {
        subCategoryMap[mainCat].forEach(sub => {
          const opt = document.createElement('option');
          opt.value = sub;
          opt.textContent = sub;
          subSelect.appendChild(opt);
        });
      }
    }

    function setTab(tab) {
      activeTab = tab;
      document.getElementById('tab-all').className = tab === 'all' ? 'px-3 py-1 rounded-md bg-slate-900 font-bold transition' : 'px-3 py-1 rounded-md text-slate-300 transition';
      document.getElementById('tab-fav').className = tab === 'fav' ? 'px-3 py-1 rounded-md bg-slate-900 font-bold transition' : 'px-3 py-1 rounded-md text-slate-300 transition';
      handleSearch();
    }

    function toggleBookmark(id) {
      if (bookmarks.includes(id)) {
        bookmarks = bookmarks.filter(bId => bId !== id);
      } else {
        bookmarks.push(id);
      }
      localStorage.setItem('sw25_bookmarks', JSON.stringify(bookmarks));
      handleSearch();
    }

    function handleSearch() {
      const keyword = document.getElementById('search-input').value.toLowerCase();
      const mainCat = document.getElementById('main-category').value;
      const subCat = document.getElementById('sub-category').value;
      const rank = document.getElementById('rank-filter').value;
      const sortKey = document.getElementById('sort-select').value;

      let filtered = items.filter(item => {
        if (activeTab === 'fav' && !bookmarks.includes(item.id)) return false;
        if (mainCat !== 'all' && item.type !== mainCat) return false;
        if (subCat !== 'all' && item.category !== subCat) return false;
        if (rank !== 'all' && item.rank !== rank) return false;

        const matchText = (item.name + (item.category || '') + (item.effect || '')).toLowerCase();
        return matchText.includes(keyword);
      });

      // ソート処理
      filtered.sort((a, b) => {
        if (sortKey === 'categoryOrder') {
          const indexA = mainCategoryOrder.indexOf(a.type);
          const indexB = mainCategoryOrder.indexOf(b.type);
          const orderA = indexA === -1 ? 999 : indexA;
          const orderB = indexB === -1 ? 999 : indexB;
          return orderA - orderB;
        }
        if (sortKey === 'name') return a.name.localeCompare(b.name, 'ja');
        if (sortKey === 'reqStr') return (a.reqStr || 0) - (b.reqStr || 0);
        if (sortKey === 'power') return (b.power || 0) - (a.power || 0);
        if (sortKey === 'price') return (a.price || 0) - (b.price || 0);
        return 0;
      });

      render(filtered);
    }

    function render(data) {
      const container = document.getElementById('card-container');
      document.getElementById('result-count').textContent = `検索結果: ${data.length}件`;
      container.innerHTML = '';

      if (data.length === 0) {
        container.innerHTML = `<div class="col-span-full text-center py-8 text-slate-400">該当するデータが見つかりません。</div>`;
        return;
      }

      data.forEach(item => {
        const isFav = bookmarks.includes(item.id);
        const card = document.createElement('div');
        card.className = "bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col justify-between hover:border-slate-400 transition";

        card.innerHTML = `
          <div>
            <div class="flex justify-between items-start mb-2">
              <div>
                <div class="flex gap-1 mb-1">
                  <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-slate-800 text-white">${item.type}</span>
                  <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-slate-100 text-slate-600 border">${item.category}</span>
                  ${item.rank ? `<span class="text-[10px] font-bold px-2 py-0.5 rounded bg-amber-100 text-amber-800 border border-amber-300">${item.rank}ランク</span>` : ''}
                </div>
                <h2 class="text-base font-bold text-slate-900">${item.name}</h2>
              </div>
              <button onclick="toggleBookmark('${item.id}')" class="text-xl leading-none p-1 focus:outline-none">
                ${isFav ? '★' : '☆'}
              </button>
            </div>

            ${item.type === '武器' ? `
              <div class="grid grid-cols-4 gap-1 bg-slate-50 p-2 rounded text-center text-xs mb-2 border border-slate-100">
                <div><span class="text-slate-400 block text-[9px]">用法</span>${item.usage || '-'}</div>
                <div><span class="text-slate-400 block text-[9px]">必筋</span>${item.reqStr ?? '-'}</div>
                <div><span class="text-slate-400 block text-[9px]">威力</span>${item.power ?? '-'}</div>
                <div><span class="text-slate-400 block text-[9px]">C値</span>${item.crit ?? '-'}</div>
              </div>
            ` : ''}

            <p class="text-xs text-slate-600 mb-3 leading-relaxed">${item.effect || ''}</p>
          </div>

          <div class="flex justify-between items-center text-[11px] text-slate-400 pt-2 border-t border-slate-100">
            <span>価格: <strong class="text-slate-700">${item.price ? item.price + ' G' : '-'}</strong></span>
            <span>${item.book || ''} ${item.page ? 'p.' + item.page : ''}</span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    loadData();
  </script>
</body>
</html>
